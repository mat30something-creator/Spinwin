<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spin & Win — Print Stickers</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#d0d0d0; font-family:'DM Sans',sans-serif; }

.controls {
  background:#0A0A0A;
  color:#fff;
  padding:14px 28px;
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 2px 12px rgba(0,0,0,.3);
}
.ctrl-logo { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:2px; color:#FFD234; margin-right:8px; }
.ctrl-group { display:flex;flex-direction:column;gap:3px; }
.ctrl-label { font-size:10px; color:rgba(255,255,255,.5); text-transform:uppercase; letter-spacing:.8px; }
.ctrl-input {
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);
  border-radius:5px; padding:6px 12px;
  color:#fff; font-size:12px; outline:none; width:200px;
}
.ctrl-input::placeholder { color:rgba(255,255,255,.3); }
.ctrl-select {
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);
  border-radius:5px; padding:6px 12px;
  color:#fff; font-size:12px; outline:none; cursor:pointer;
}
.ctrl-select option { background:#0A0A0A; }
.print-btn {
  background:#FFD234; color:#0A0A0A; border:none; border-radius:6px;
  padding:9px 22px; font-size:13px; font-weight:800; cursor:pointer;
  margin-left:auto; letter-spacing:.3px; transition:all .15s;
}
.print-btn:hover { background:#f0c800; transform:translateY(-1px); }
.status-badge {
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  border-radius:5px; padding:6px 14px;
  font-size:11px; color:rgba(255,255,255,.5);
}

/* Sheet */
.sticker-sheet {
  padding:40px 32px;
  display:flex;
  flex-wrap:wrap;
  gap:32px;
  justify-content:center;
  max-width:1000px;
  margin:0 auto;
}

/* Sticker outer — glossy card effect */
.sticker-outer {
  width:340px;
  padding:6px;
  border-radius:16px;
  background:linear-gradient(145deg,#e0e0e0,#c8c8c8);
  box-shadow:
    0 20px 60px rgba(0,0,0,.3),
    0 6px 16px rgba(0,0,0,.2),
    inset 0 1px 0 rgba(255,255,255,.8);
  page-break-inside:avoid;
}

/* Sticker inner */
.sticker {
  width:100%;
  height:198px;
  border-radius:12px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  position:relative;
  background:#F8F8F8;
}

/* Glossy sheen overlay */
.sticker::after {
  content:'';
  position:absolute;
  top:0; left:0; right:0;
  height:50%;
  background:linear-gradient(to bottom, rgba(255,255,255,.12), transparent);
  pointer-events:none;
  z-index:10;
  border-radius:12px 12px 0 0;
}

/* Navy corner fold */
.corner-fold {
  position:absolute;
  top:0; right:0;
  width:0; height:0;
  border-style:solid;
  border-width:0 58px 58px 0;
  border-color:transparent #050505 transparent transparent;
  z-index:5;
}

/* Header */
.s-header {
  background:linear-gradient(135deg,#1A1A1A,#0A0A0A);
  padding:9px 62px 9px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:relative;
  z-index:3;
  flex-shrink:0;
  border-bottom:2px solid #FFD234;
}
.h-left { display:flex; align-items:center; gap:7px; }
.h-bolt {
  width:15px; height:15px; flex-shrink:0;
  background:#FFD234;
  clip-path:polygon(60% 0%,38% 46%,62% 46%,34% 100%,54% 54%,28% 54%);
}
.h-logo { font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:3px; color:#fff; }
.h-badge {
  background:#FFD234; color:#0A0A0A;
  font-size:7.5px; font-weight:800; letter-spacing:1.5px;
  text-transform:uppercase; padding:3px 9px; border-radius:2px;
  white-space:nowrap;
}

/* Body */
.s-body {
  flex:1;
  display:flex;
  align-items:center;
  position:relative;
  overflow:hidden;
  background:#F8F8F8;
}

/* Diagonal stripe texture */
.s-body::before {
  content:'';
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(
    -45deg,
    transparent, transparent 12px,
    rgba(27,79,191,.035) 12px,
    rgba(27,79,191,.035) 13px
  );
}

/* Blue left bar */
.s-body::after {
  content:'';
  position:absolute;
  left:0; top:0; bottom:0; width:5px;
  background:linear-gradient(to bottom,#1A1A1A,#0A0A0A);
}

/* QR */
.b-qr {
  width:88px; height:88px;
  margin:0 0 0 14px;
  background:#fff;
  border:1.5px solid #dce8ff;
  border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
  position:relative; z-index:2;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
  overflow:hidden;
}
.b-qr img { width:100%; height:100%; }
.qr-placeholder { font-size:9px; color:#aaa; text-align:center; padding:6px; line-height:1.4; }

/* Content */
.b-content {
  flex:1;
  padding:10px 14px 10px 11px;
  display:flex; flex-direction:column; justify-content:center;
  position:relative; z-index:2; min-width:0;
}
.b-eyebrow {
  font-size:7px; font-weight:800; letter-spacing:2px;
  text-transform:uppercase; color:#1A1A1A;
  margin-bottom:2px; white-space:nowrap;
}
.b-headline {
  font-family:'Bebas Neue',sans-serif;
  line-height:.95; margin-bottom:5px;
}
.b-headline .l1 { font-size:14px; letter-spacing:1.5px; color:#1a1a2e; display:block; }
.b-headline .l2 {
  font-size:30px; display:block; letter-spacing:.5px;
  background:linear-gradient(135deg,#C8960C,#FFD234,#B8860C,#FFD234);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
  filter:drop-shadow(0 1px 2px rgba(184,134,12,.3));
}
.b-headline .l3 { font-size:14px; letter-spacing:1.5px; color:#1a1a2e; display:block; }

.b-sub { font-size:7px; color:#9aa; line-height:1.5; margin-bottom:8px; }

.prizes { display:flex; gap:3px; }
.pc {
  flex:1;
  background:linear-gradient(135deg,#1A1A1A,#0A0A0A);
  border-radius:4px;
  padding:4px 2px;
  text-align:center;
  box-shadow:0 2px 4px rgba(0,0,0,.3);
}
.pc-amt {
  font-family:'Bebas Neue',sans-serif; font-size:11px;
  color:#FFD234; line-height:1;
}
.pc-lbl { font-size:6px; color:rgba(255,255,255,.5); text-transform:uppercase; letter-spacing:.3px; }

/* Footer */
.s-footer {
  background:linear-gradient(135deg,#0A0A0A,#050505);
  padding:5px 14px;
  display:flex; align-items:center; justify-content:space-between;
  flex-shrink:0; position:relative; z-index:3;
}
.f-dealer {
  font-size:8.5px; font-weight:800; letter-spacing:1.5px;
  text-transform:uppercase;
  background:linear-gradient(90deg,#FFD234,#fff9e0);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
}
.f-disc { font-size:6.5px; color:rgba(255,255,255,.3); }

/* Print */
@media print {
  body { background:#fff !important; }
  .controls { display:none !important; }
  .sticker-sheet { padding:0; gap:8mm; }
  .sticker-outer { width:89mm; padding:0; border-radius:4px; background:none; box-shadow:none; }
  .sticker { height:56mm; border-radius:4px; }
  * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}
</style>
</head>
<body>

<div class="controls">
  <div class="ctrl-logo">⚡ SPIN & WIN</div>
  <div class="ctrl-group">
    <div class="ctrl-label">Dealer Name</div>
    <input class="ctrl-input" type="text" id="ctrlDealer" placeholder="Your Dealership" oninput="updateStickers()"/>
  </div>
  <div class="ctrl-group">
    <div class="ctrl-label">How Many?</div>
    <select class="ctrl-select" id="ctrlCount" onchange="updateStickers()">
      <option value="1">1 sticker</option>
      <option value="2">2 stickers</option>
      <option value="4" selected>4 stickers</option>
      <option value="6">6 stickers</option>
      <option value="8">8 stickers</option>
      <option value="10">10 stickers</option>
      <option value="12">12 stickers</option>
      <option value="16">16 stickers</option>
      <option value="20">20 stickers</option>
      <option value="25">25 stickers</option>
    </select>
  </div>
  <div class="status-badge" id="statusBadge">Loading prizes…</div>
  <button class="print-btn" onclick="window.print()">🖨 Print Stickers</button>
</div>

<div class="sticker-sheet" id="stickerSheet"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const params    = new URLSearchParams(location.search);
const QR_ID     = params.get('qr')     || 'QR-LOT-001';
const DEALER_ID = params.get('dealer') || 'DEALER-DEMO';
const BASE_URL  = location.origin;

let prizes   = [{label:'$100'},{label:'$200'},{label:'$500'},{label:'$1,000'}];
let topPrize = '$1,000';
let dealerName = params.get('name') || 'Your Dealership';

async function loadConfig() {
  try {
    const res = await fetch(`/api/qr/${QR_ID}/config`);
    if (!res.ok) throw new Error();
    const data = await res.json();
    dealerName = data.dealerName || dealerName;
    document.getElementById('ctrlDealer').value = dealerName;
    const p = data.prizes;
    const amounts = [p.amt1||100, p.amt2||200, p.amt3||500, p.amt4||1000];
    prizes = amounts.map(a => ({ label: '$' + Number(a).toLocaleString() }));
    topPrize = '$' + Number(Math.max(...amounts)).toLocaleString();
    document.getElementById('statusBadge').textContent = '✓ Live prizes loaded';
    document.getElementById('statusBadge').style.color = '#4ADE80';
  } catch(e) {
    document.getElementById('statusBadge').textContent = 'Default prizes';
  }
  updateStickers();
}

function updateStickers() {
  const count  = parseInt(document.getElementById('ctrlCount').value);
  const dealer = document.getElementById('ctrlDealer').value || dealerName;
  const sheet  = document.getElementById('stickerSheet');
  sheet.innerHTML = '';

  for (let i = 0; i < count; i++) {
    const outer = document.createElement('div');
    outer.className = 'sticker-outer';
    outer.innerHTML = `
      <div class="sticker">
        <div class="corner-fold"></div>
        <div class="s-header">
          <div class="h-left">
            <div class="h-bolt"></div>
            <div class="h-logo">SPIN &amp; WIN</div>
          </div>
          <div class="h-badge">Exclusive Offer</div>
        </div>
        <div class="s-body">
          <div class="b-qr" id="qr-${i}"><div class="qr-placeholder">Generating…</div></div>
          <div class="b-content">
            <div class="b-eyebrow">Scan to unlock your prize</div>
            <div class="b-headline">
              <span class="l1">WIN UP TO</span>
              <span class="l2">${esc(topPrize)} OFF</span>
              <span class="l3">THIS VEHICLE</span>
            </div>
            <div class="b-sub">Point your phone camera at the QR code<br/>No app needed · Takes 30 seconds</div>
            <div class="prizes">
              ${prizes.map(p=>`<div class="pc"><div class="pc-amt">${esc(p.label)}</div><div class="pc-lbl">off</div></div>`).join('')}
            </div>
          </div>
        </div>
        <div class="s-footer">
          <div class="f-dealer">${esc(dealer)}</div>
          <div class="f-disc">No purchase necessary · One spin per device</div>
        </div>
      </div>`;
    sheet.appendChild(outer);

    // Generate QR
    const qrEl = document.getElementById(`qr-${i}`);
    qrEl.innerHTML = '';
    try {
      new QRCode(qrEl, {
        text: `${BASE_URL}/?qr=${QR_ID}&dealer=${DEALER_ID}`,
        width:88, height:88,
        colorDark:'#000000', colorLight:'#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });
    } catch(e) { qrEl.innerHTML = '<div class="qr-placeholder">QR code</div>'; }
  }
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

loadConfig();
</script>
</body>
</html>
